name: Build and check APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;30.0.3" "build-tools;34.0.0"

      - name: Build (debug and release)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleStfdroidDebug assembleStfdroidRelease

      - name: Check the APK files
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ls -la smarttubetv/build/outputs/apk/stfdroid/*/
          for apk in smarttubetv/build/outputs/apk/stfdroid/*/*universal*.apk; do
            echo "=== $apk"
            MINSDK=$("$BT/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
            echo "minSdk: $MINSDK"
            if [ "$MINSDK" -gt 21 ]; then echo "ERROR: APK needs API $MINSDK, but it must install on Android 5.0 (API 21)"; exit 1; fi
            "$BT/aapt" dump badging "$apk" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|launchable-activity|leanback-launchable|native-code"
            unzip -l "$apk" | grep -c "classes.*\.dex" | sed 's/^/dex files: /'
            "$BT/zipalign" -c 4 "$apk" && echo "zipalign: OK"
            "$BT/apksigner" verify --print-certs "$apk" | head -3 || echo "apksigner: not signed (release without keystore.properties)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: YouNew-apk
          path: smarttubetv/build/outputs/apk/stfdroid/**/*.apk
          if-no-files-found: error

  # Install and start the app on emulators from Android 5.0 up, and fail if it crashes on start.
  # 5.1 (API 22) is the Android version of the TV boxes this app is made for.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, arch: x86 }        # Android 5.0
          - { api: 22, arch: x86 }        # Android 5.1
          - { api: 26, arch: x86 }        # Android 8.0
          - { api: 30, arch: x86_64 }     # Android 11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: YouNew-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check-api${{ matrix.api }}
          path: |
            logcat.txt
            screen.png
