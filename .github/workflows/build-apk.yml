name: Build and check APK

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v32.68). Leave empty for a normal check.'
        required: false
        default: ''
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;30.0.3" "build-tools;34.0.0"

      # Your own signing key, kept as repository secrets (Settings > Secrets and variables > Actions):
      # KEYSTORE_BASE64 (the .jks file in base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # With it every build has the same signature, so new versions install over old ones.
      # Without it the build uses a throw-away debug key that changes from build to build.
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in secrets: APKs use a temporary debug key, so they will not update over an earlier build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing with the key from secrets"

      - name: Build (debug and release)
        run: |
          chmod +x gradlew
          # Two builds of the same app: legacy (Android 5.0 and newer) and modern (Android 8.0 and newer).
          # Each build's files are copied out right away: the second build may clear the output folder.
          ./gradlew --no-daemon --stacktrace assembleStfdroidDebug assembleStfdroidRelease
          for t in debug release; do mkdir -p "dist/$t"; cp smarttubetv/build/outputs/apk/stfdroid/$t/*.apk "dist/$t/"; done
          ./gradlew --no-daemon --stacktrace -PyounewModern assembleStfdroidDebug assembleStfdroidRelease
          for t in debug release; do cp smarttubetv/build/outputs/apk/stfdroid/$t/*modern*.apk "dist/$t/"; done

      # The "Fast" test build (own app id and name, installs next to the normal app): only for a Fast release,
      # that is a release tag that contains "fast" (for example v33.16-fast). Its release APK is what the emulators test.
      - name: Build the Fast test build
        if: contains(inputs.release_tag, 'fast')
        run: |
          ./gradlew --no-daemon --stacktrace -PyounewFast assembleStfdroidRelease
          cp smarttubetv/build/outputs/apk/stfdroid/release/*fast*.apk dist/release/

      - name: Check the APK files
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ls -la dist/*/
          for apk in dist/*/*universal*.apk; do
            echo "=== $apk"
            MINSDK=$("$BT/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
            echo "minSdk: $MINSDK"
            case "$apk" in
              *modern*) if [ "$MINSDK" -ne 26 ]; then echo "ERROR: the modern APK must need API 26 (Android 8.0), it needs $MINSDK"; exit 1; fi ;;
              *) if [ "$MINSDK" -gt 21 ]; then echo "ERROR: APK needs API $MINSDK, but it must install on Android 5.0 (API 21)"; exit 1; fi ;;
            esac
            "$BT/aapt" dump badging "$apk" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|launchable-activity|leanback-launchable|native-code"
            unzip -l "$apk" | grep -c "classes.*\.dex" | sed 's/^/dex files: /'
            "$BT/zipalign" -c 4 "$apk" && echo "zipalign: OK"
            # Fails the build if the APK is not signed (Android refuses to install it then)
            # the modern build (Android 8+) is signed with the newer signature schemes only (no META-INF/MANIFEST.MF)
            case "$apk" in *modern*) SIGN_MIN=26 ;; *) SIGN_MIN=21 ;; esac
            "$BT/apksigner" verify --min-sdk-version $SIGN_MIN --print-certs "$apk" > signer.txt
            head -3 signer.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: YouNew-apk
          path: dist/**/*.apk
          if-no-files-found: error

  # Install and start the app on emulators from Android 5.0 up, and fail if it crashes on start.
  # 5.1 (API 22) is the Android version of the TV boxes this app is made for.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # a Fast release tests the Fast app (package com.younew.tv.fast); anything else tests the normal apps
      TEST_FAST: ${{ contains(inputs.release_tag, 'fast') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, arch: x86 }        # Android 5.0
          - { api: 22, arch: x86 }        # Android 5.1
          - { api: 26, arch: x86 }        # Android 8.0
          - { api: 30, arch: x86_64 }     # Android 11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: YouNew-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check-api${{ matrix.api }}
          path: |
            logcat.txt
            screen.png
            signin.png
            signin-tv.png
            signin-page.png
            settings-*.png
            search*.png
            home-*.png
            player*.png
            logcat-player.txt
            ui-*.xml

  # When a GitHub Release is published, attach the release APKs with simple names:
  # YouTvPlus.apk (universal) and YouTvPlus-<abi>.apk. Runs only after every emulator check passed.
  attach-to-release:
    # A published GitHub Release, or a pushed version tag such as v32.68 (the release is then created here)
    # Also from the Actions tab: "Run workflow" with a release tag
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YouNew-apk
          path: apk

      - name: Upload APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          TAG="${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}"
          FAST_TAG=0; case "$TAG" in *fast*) FAST_TAG=1 ;; esac
          for f in apk/release/YouTvPlus-*.apk; do
            # a Fast release (tag with "fast") has only the Fast files; every other release never has them
            case "$f" in *fast*) [ "$FAST_TAG" = 1 ] || continue ;; *) [ "$FAST_TAG" = 1 ] && continue ;; esac
            abi=$(basename "$f" .apk | sed -E 's/^YouTvPlus-[^-]+-//')
            # legacy (Android 5.0+): YouTvPlus.apk, YouTvPlus-<cpu>.apk. modern (Android 8.0+): YouTvPlus-modern.apk, YouTvPlus-modern-<cpu>.apk
            if [ "$abi" = "universal" ]; then cp "$f" out/YouTvPlus.apk
            elif [ "$abi" = "modern-universal" ]; then cp "$f" out/YouTvPlus-modern.apk
            elif [ "$abi" = "fast-universal" ]; then cp "$f" out/YouTvPlus-fast.apk
            else cp "$f" "out/YouTvPlus-$abi.apk"; fi
          done
          ls -la out
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            if [ "$FAST_TAG" = 1 ]; then
              NOTES="YouTv Plus ${TAG#v} FAST TEST. A separate app to compare with the normal one: it has its own name (YouTv Plus Fast) and installs NEXT TO it, so your normal app is not touched. Shrunk code, faster video start, no self-update; sign in again inside it. Take **YouTvPlus-fast.apk**."
            else
              NOTES="YouTv Plus ${TAG#v}. Two versions: **Android 8 and newer** (new TV, phone, tablet): take **YouTvPlus-modern.apk**. **Android 5, 6 or 7** (old TV box): take **YouTvPlus.apk** (it also works on newer Android). Smaller files: YouTvPlus-modern-arm64-v8a.apk / YouTvPlus-modern-armeabi-v7a.apk (Android 8+) and YouTvPlus-armeabi-v7a.apk (Android 5+)."
            fi
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "YouTv Plus ${TAG#v}" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" out/*.apk --clobber --repo "${{ github.repository }}"
          # Beta tags (for example v33.02-beta) are marked as pre-releases: the normal download link keeps
          # pointing at the newest production release; beta testers see them in the app (About > beta) and on the page
          # Fast test releases (tag with "fast", for example v33.16-fast) are pre-releases too
          if [[ "$TAG" == *beta* || "$TAG" == *fast* ]]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false
          fi
          # Also fix the releases made before this rule: every beta release is a pre-release, every other one is not
          gh release list --repo "${{ github.repository }}" --limit 50 --json tagName -q '.[].tagName' | while read -r T; do
            if [[ "$T" == *beta* || "$T" == *fast* ]]; then
              gh release edit "$T" --repo "${{ github.repository }}" --prerelease || true
            else
              gh release edit "$T" --repo "${{ github.repository }}" --prerelease=false || true
            fi
          done
